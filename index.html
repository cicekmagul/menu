<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İçecek Menüsü</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #FAF6F0;
            --bg-card: #FFFFFF;
            --bg-pill: #EFE7DC;
            --text-primary: #2C221E;
            --text-secondary: #7A6B63;
            --accent: #C86D51;
            --accent-hover: #B35B40;
            --shadow-soft: 0 10px 30px -5px rgba(44, 34, 30, 0.06);
            --shadow-card: 0 4px 15px rgba(44, 34, 30, 0.04);
            --radius-lg: 24px;
            --radius-md: 18px;
            --radius-pill: 999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- ŞİFRE EKRANI --- */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 100;
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #lock-screen.unlocked {
            opacity: 0;
            transform: scale(1.04);
            pointer-events: none;
        }

        .lock-card {
            background: var(--bg-card);
            width: 100%;
            max-width: 360px;
            padding: 36px 28px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            text-align: center;
        }

        .lock-icon {
            width: 56px;
            height: 56px;
            background: var(--bg-pill);
            color: var(--accent);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 18px;
        }

        .lock-card h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .lock-card p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .pass-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid var(--bg-pill);
            border-radius: var(--radius-md);
            background: var(--bg-main);
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 3px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            margin-bottom: 14px;
        }

        .pass-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(200, 109, 81, 0.12);
        }

        .pass-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--accent);
            color: #FFF;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.25s ease;
        }

        .pass-btn:active {
            transform: scale(0.97);
        }

        .error-msg {
            color: #D94E4E;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
            font-weight: 500;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }

        /* --- ANA MENÜ EKRANI --- */
        #menu-app {
            width: 100%;
            max-width: 520px;
            padding: 28px 20px 60px;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.5s ease 0.15s, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.15s;
        }

        #menu-app.visible {
            opacity: 1;
            transform: translateY(0);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header span {
            display: inline-block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Kategori Sekmeleri */
        .tabs-wrapper {
            position: sticky;
            top: 12px;
            z-index: 20;
            background: rgba(250, 246, 240, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: var(--radius-pill);
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(44, 34, 30, 0.04);
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 12px 10px;
            border-radius: var(--radius-pill);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(200, 109, 81, 0.3);
        }

        /* İçecek Kartları */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .drink-card {
            background: var(--bg-card);
            padding: 20px 22px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            justify-content: center;
            opacity: 0;
            transform: translateY(14px) scale(0.98);
            animation: cardIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: transform 0.2s ease;
        }

        .drink-card:active {
            transform: scale(0.985);
        }

        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .drink-name {
            font-family: 'Outfit', sans-serif;
            font-size: 19px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .drink-desc {
            font-size: 13.5px;
            color: var(--text-secondary);
            margin-top: 6px;
            line-height: 1.45;
        }

        .status-box {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- ŞİFRE GİRİŞ EKRANI -->
    <div id="lock-screen">
        <div class="lock-card" id="lock-card">
            <div class="lock-icon">☕</div>
            <h1>Özel Menü</h1>
            <p>İçecek listesini görmek için giriş şifresini yaz.</p>
            <input type="password" id="password-input" class="pass-input" placeholder="••••" autocomplete="off">
            <button id="unlock-btn" class="pass-btn">Menüyü Aç</button>
            <div id="error-msg" class="error-msg"></div>
        </div>
    </div>

    <!-- ANA MENÜ EKRANI -->
    <main id="menu-app">
        <header>
            <h2>İçecek Menüsü</h2>
            <span>Bugün ne içmek istersin?</span>
        </header>

        <div class="tabs-wrapper">
            <div class="tabs">
                <button class="tab-btn active" data-cat="Sıcak">Sıcak</button>
                <button class="tab-btn" data-cat="Soğuk">Soğuk</button>
                <button class="tab-btn" data-cat="Alkol">Alkol</button>
            </div>
        </div>

        <div id="menu-list" class="menu-list">
            <div class="status-box">Menü yükleniyor...</div>
        </div>
    </main>

    <script>
        // ==========================================
        // AYARLAR (BURAYI KENDİNE GÖRE DÜZENLE)
        // ==========================================
        const SHEET_ID = "1DaNNim2_3VMIS0daOPrbijp68-i5UXO7t_38XUchdFY"; 
        const MENU_SIFRESI = "muhendiscicek"; 
        // ==========================================

        let allDrinks = [];
        let currentCategory = "Sıcak";

        const lockScreen = document.getElementById("lock-screen");
        const lockCard = document.getElementById("lock-card");
        const passInput = document.getElementById("password-input");
        const unlockBtn = document.getElementById("unlock-btn");
        const errorMsg = document.getElementById("error-msg");
        const menuApp = document.getElementById("menu-app");
        const menuList = document.getElementById("menu-list");
        const tabBtns = document.querySelectorAll(".tab-btn");

        // Daha önce şifre girildiyse kilidi otomatik aç
        if (localStorage.getItem("qr_menu_auth") === MENU_SIFRESI) {
            unlockMenu(true);
        }

        function checkPassword() {
            if (passInput.value.trim() === MENU_SIFRESI) {
                localStorage.setItem("qr_menu_auth", MENU_SIFRESI);
                unlockMenu(false);
            } else {
                errorMsg.textContent = "Hatalı şifre, tekrar dene.";
                lockCard.classList.remove("shake");
                void lockCard.offsetWidth; // Animasyonu sıfırla
                lockCard.classList.add("shake");
                passInput.value = "";
            }
        }

        function unlockMenu(instant) {
            if (instant) {
                lockScreen.style.display = "none";
            } else {
                lockScreen.classList.add("unlocked");
                setTimeout(() => lockScreen.style.display = "none", 500);
            }
            menuApp.classList.add("visible");
            fetchSheetData();
        }

        unlockBtn.addEventListener("click", checkPassword);
        passInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") checkPassword();
        });

        // Google Sheets'ten canlı veri çekme (gviz JSON API)
        async function fetchSheetData() {
            if (SHEET_ID === "BURAYA_GOOGLE_SHEET_ID_YAZ") {
                // Demo verisi (ID girilmeden önizleme yapabilmen için)
                allDrinks = [
                    { kategori: "Sıcak", ad: "V60 Pour Over", icerik: "Etiyopya Yirgacheffe çekirdekleri, çiçeksi notalar" },
                    { kategori: "Sıcak", ad: "Türk Kahvesi", icerik: "" },
                    { kategori: "Sıcak", ad: "Flat White", icerik: "Çift shot espresso ve kadifemsi mikro köpük" },
                    { kategori: "Soğuk", ad: "Cold Brew", icerik: "16 saat soğuk demleme" },
                    { kategori: "Soğuk", ad: "Ev Yapımı Limonata", icerik: "Taze nane ve zencefil dokunuşuyla" },
                    { kategori: "Alkol", ad: "Negroni", icerik: "Cin, Campari, tatlı vermut ve portakal kabuğu" },
                    { kategori: "Alkol", ad: "Aperol Spritz", icerik: "" }
                ];
                renderMenu(currentCategory);
                return;
            }

            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
                const response = await fetch(url);
                const text = await response.text();
                // Google'ın JSONP sarmalayıcısını temizle
                const jsonString = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
                const data = JSON.parse(jsonString);

                const rows = data.table.rows;
                allDrinks = rows.map(row => {
                    const c = row.c;
                    return {
                        kategori: c[0] && c[0].v ? String(c[0].v).trim() : "",
                        ad: c[1] && c[1].v ? String(c[1].v).trim() : "",
                        icerik: c[2] && c[2].v ? String(c[2].v).trim() : ""
                    };
                }).filter(item => item.ad !== "" && item.ad.toLowerCase() !== "ad");

                renderMenu(currentCategory);
            } catch (err) {
                menuList.innerHTML = `<div class="status-box">Menü yüklenemedi. Tablo paylaşım ayarını kontrol et.</div>`;
            }
        }

        function renderMenu(category) {
            const filtered = allDrinks.filter(
                d => d.kategori.toLowerCase() === category.toLowerCase()
            );

            if (filtered.length === 0) {
                menuList.innerHTML = `<div class="status-box">Bu kategoride henüz içecek yok.</div>`;
                return;
            }

            menuList.innerHTML = "";
            filtered.forEach((drink, index) => {
                const card = document.createElement("div");
                card.className = "drink-card";
                // Kartların peş peşe akıcı gelmesi için kademeli gecikme
                card.style.animationDelay = `${index * 0.05}s`;

                const nameEl = document.createElement("div");
                nameEl.className = "drink-name";
                nameEl.textContent = drink.ad;
                card.appendChild(nameEl);

                // İçerik boş değilse alt satırı oluştur
                if (drink.icerik) {
                    const descEl = document.createElement("div");
                    descEl.className = "drink-desc";
                    descEl.textContent = drink.icerik;
                    card.appendChild(descEl);
                }

                menuList.appendChild(card);
            });
        }

        // Kategori geçişleri
        tabBtns.forEach(btn => {
            btn.addEventListener("click", () => {
                tabBtns.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentCategory = btn.dataset.cat;
                renderMenu(currentCategory);
            });
        });
    </script>
</body>
</html>
