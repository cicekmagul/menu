<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İçecek Menüsü</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #FAF6F0;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-pill: #EFE7DC;
            --text-primary: #2C221E;
            --text-secondary: #7A6B63;
            --accent: #C86D51;
            --accent-hover: #B35B40;
            --shadow-soft: 0 12px 32px -6px rgba(44, 34, 30, 0.08);
            --shadow-card: 0 4px 15px rgba(44, 34, 30, 0.05);
            --radius-lg: 26px;
            --radius-md: 18px;
            --radius-pill: 999px;

            /* Arka plan fotoğrafı ayarları */
            --arkaplan-resmi: url('arkaplan.jpg');
            --arkaplan-opaklik: 0.12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- SABİT DÜŞÜK OPAKLI ARKA PLAN FOTOĞRAFI --- */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: var(--arkaplan-resmi);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: var(--arkaplan-opaklik);
            z-index: -1;
            pointer-events: none;
        }

        /* --- ŞİFRE EKRANI --- */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: rgba(250, 246, 240, 0.96);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 100;
            transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #lock-screen.unlocked {
            opacity: 0;
            transform: scale(1.04);
            pointer-events: none;
        }

        .lock-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 360px;
            padding: 36px 28px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            text-align: center;
        }

        .lock-icon {
            width: 56px;
            height: 56px;
            background: var(--bg-pill);
            color: var(--accent);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 18px;
        }

        .lock-card h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .lock-card p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .pass-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid var(--bg-pill);
            border-radius: var(--radius-md);
            background: var(--bg-main);
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 2px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            margin-bottom: 14px;
        }

        .pass-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(200, 109, 81, 0.12);
        }

        .pass-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--accent);
            color: #FFF;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.25s ease;
        }

        .pass-btn:active {
            transform: scale(0.97);
        }

        .error-msg {
            color: #D94E4E;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
            font-weight: 500;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }

        /* --- ANA UYGULAMA ALANI --- */
        #menu-app {
            width: 100%;
            max-width: 520px;
            padding: 28px 20px 60px;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.45s ease 0.1s, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.1s;
        }

        #menu-app.visible {
            opacity: 1;
            transform: translateY(0);
        }

        header {
            text-align: center;
            margin-bottom: 22px;
            cursor: pointer;
        }

        .header-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header-logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            object-fit: cover;
            box-shadow: 0 4px 12px rgba(44, 34, 30, 0.08);
        }

        header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-subrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .header-subtitle {
