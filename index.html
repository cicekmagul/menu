<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İçecek Menüsü</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #FAF6F0;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-pill: #EFE7DC;
            --text-primary: #2C221E;
            --text-secondary: #7A6B63;
            --accent: #C86D51;
            --accent-hover: #B35B40;
            --shadow-soft: 0 12px 32px -6px rgba(44, 34, 30, 0.08);
            --shadow-card: 0 4px 15px rgba(44, 34, 30, 0.05);
            --radius-lg: 26px;
            --radius-md: 18px;
            --radius-pill: 999px;

            /* Arka plan fotoğrafı ayarları */
            --arkaplan-resmi: url('arkaplan.jpg');
            --arkaplan-opaklik: 0.12;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- SABİT DÜŞÜK OPAKLI ARKA PLAN FOTOĞRAFI --- */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: var(--arkaplan-resmi);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: var(--arkaplan-opaklik);
            z-index: -1;
            pointer-events: none;
        }

        /* --- ŞİFRE / KARŞILAMA EKRANI --- */
        #lock-screen {
            position: fixed;
            inset: 0;
            background: rgba(250, 246, 240, 0.94);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 100;
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #lock-screen.unlocked {
            opacity: 0;
            transform: scale(1.04);
            pointer-events: none;
        }

        .lock-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 360px;
            padding: 36px 28px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            text-align: center;
        }

        .lock-icon {
            width: 56px;
            height: 56px;
            background: var(--bg-pill);
            color: var(--accent);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 18px;
        }

        .lock-card h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .lock-card p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .pass-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid var(--bg-pill);
            border-radius: var(--radius-md);
            background: var(--bg-main);
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 3px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            margin-bottom: 14px;
        }

        .pass-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(200, 109, 81, 0.12);
        }

        .pass-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--accent);
            color: #FFF;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.25s ease;
        }

        .pass-btn:active {
            transform: scale(0.97);
        }

        .error-msg {
            color: #D94E4E;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
            font-weight: 500;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.3s ease-in-out; }

        /* --- ANA UYGULAMA ALANI --- */
        #menu-app {
            width: 100%;
            max-width: 520px;
            padding: 28px 20px 80px;
            opacity: 0;
            transform: translateY(15px);
            transition: opacity 0.5s ease 0.15s, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.15s;
        }

        #menu-app.visible {
            opacity: 1;
            transform: translateY(0);
        }

        header {
            text-align: center;
            margin-bottom: 22px;
            cursor: pointer;
        }

        .header-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header-logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            object-fit: cover;
            box-shadow: 0 4px 12px rgba(44, 34, 30, 0.08);
        }

        header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header span {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* Kategori Sekmeleri */
        .tabs-wrapper {
            position: sticky;
            top: 12px;
            z-index: 20;
            background: rgba(250, 246, 240, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: var(--radius-pill);
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(44, 34, 30, 0.05);
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .tab-btn {
            border: none;
            background: transparent;
            padding: 12px 10px;
            border-radius: var(--radius-pill);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(200, 109, 81, 0.3);
        }

        /* --- FOTOĞRAFLI ANA SAYFA --- */
        #home-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: heroIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        #home-view.hidden {
            display: none;
        }

        @keyframes heroIn {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .hero-photo-card {
            width: 100%;
            background: var(--bg-card);
            backdrop-filter: blur(6px);
            padding: 12px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
        }

        .hero-photo-card img {
            width: 100%;
            aspect-ratio: 4 / 5;
            object-fit: cover;
            border-radius: 18px;
            display: block;
        }

        .hero-caption {
            text-align: center;
            padding: 16px 10px 8px;
        }

        .hero-caption p {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .hero-caption small {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* --- İÇECEK LİSTESİ --- */
        #menu-view.hidden {
            display: none;
        }

        .back-home-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .back-home-btn {
            border: none;
            background: var(--bg-pill);
            color: var(--text-secondary);
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        .back-home-btn:active {
            transform: scale(0.96);
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .drink-card {
            background: var(--bg-card);
            backdrop-filter: blur(6px);
            padding: 18px 20px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-card);
            display: flex;
            align-items: center;
            gap: 16px;
            opacity: 0;
            transform: translateY(14px) scale(0.98);
            animation: cardIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transition: transform 0.2s ease;
        }

        .drink-card:active {
            transform: scale(0.985);
        }

        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .drink-thumb {
            width: 66px;
            height: 66px;
            border-radius: 14px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--bg-pill);
        }

        .drink-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        .drink-name {
            font-family: 'Outfit', sans-serif;
            font-size: 19px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .drink-desc {
            font-size: 13.5px;
            color: var(--text-secondary);
            margin-top: 5px;
            line-height: 1.45;
        }

        .status-box {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 14px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
        }

        /* --- MÜZİK KONTROL BUTONU --- */
        .music-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 50;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid var(--bg-pill);
            border-radius: var(--radius-pill);
            padding: 10px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            transition: transform 0.2s ease, background 0.25s ease, color 0.25s ease;
        }

        .music-toggle:active {
            transform: scale(0.95);
        }

        .music-toggle.playing {
            background: var(--accent);
            color: #FFFFFF;
            border-color: var(--accent);
        }

        .music-bars {
            display: inline-flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
        }

        .music-bars span {
            width: 3px;
            height: 4px;
            background: currentColor;
            border-radius: 2px;
            transition: height 0.2s ease;
        }

        .music-toggle.playing .music-bars span:nth-child(1) {
            animation: eq 0.6s infinite alternate;
        }
        .music-toggle.playing .music-bars span:nth-child(2) {
            animation: eq 0.45s infinite alternate 0.2s;
        }
        .music-toggle.playing .music-bars span:nth-child(3) {
            animation: eq 0.7s infinite alternate 0.1s;
        }

        @keyframes eq {
            from { height: 3px; }
            to { height: 12px; }
        }
    </style>
</head>
<body>

    <!-- ARKA PLAN MÜZİĞİ -->

    <!-- ANA UYGULAMA EKRANI -->

        <section id="menu-view" class="hidden">

            <div id="menu-list" class="menu-list">
                <div class="status-box">Menü yükleniyor...</div>

        </section>

        <!-- SAĞ ALT MÜZİK KONTROLÜ -->
        <button id="music-toggle" class="music-toggle" aria-label="Müziği Aç veya Durdur">
            <div class="music-bars">
                <span></span><span></span><span></span>
            </div>
            <span id="music-label">Müzik</span>
        </button>
    </main>
